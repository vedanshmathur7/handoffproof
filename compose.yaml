services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: handoffproof
      POSTGRES_USER: handoffproof
      POSTGRES_PASSWORD: handoffproof
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handoffproof -d handoffproof"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - handoffproof_postgres:/var/lib/postgresql/data

volumes:
  handoffproof_postgres:
